[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulations-public-comments"
version = "2.0.0"
description = "A Python wrapper for the Regulations.gov API to download public comments, dockets, and documents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Will Jobs" }]
requires-python = ">=3.9"
keywords = ["regulations", "public-comments", "regulations.gov", "api", "government"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "python-dateutil>=2.8",
    "urllib3>=1.26",
    "rich-click>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "ruff>=0.4",
    "mypy>=1.0",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
comments-downloader = "regulations_public_comments.cli:main"

[project.urls]
Homepage = "https://github.com/willjobs/regulations-public-comments"
Documentation = "https://willjobs.github.io/regulations-public-comments"
Repository = "https://github.com/willjobs/regulations-public-comments"
"Bug Tracker" = "https://github.com/willjobs/regulations-public-comments/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regulations_public_comments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
src = ["src"]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
